name: PC Python testleri

on:
  push:
    branches: [main]
    paths:
      - "trceviri/**"
  pull_request:
    paths:
      - "trceviri/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bağımlılıkları kur
        run: python -m pip install pytest PySide6 numpy
      - name: PC testlerini çalıştır
        run: pytest trceviri/tests -q
