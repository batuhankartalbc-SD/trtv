name: PC Python testleri

on:
  push:
    branches: [main]
    paths:
      - "trceviri/**"
      - ".github/workflows/pc-tests.yml"
  pull_request:
    paths:
      - "trceviri/**"
      - ".github/workflows/pc-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: trceviri/requirements.txt
      - name: Bağımlılıkları kur
        run: python -m pip install -r trceviri/requirements.txt
      - name: PC testlerini çalıştır
        working-directory: trceviri
        run: python -m pytest -q tests
