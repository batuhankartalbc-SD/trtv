name: GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "brand/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: Pages'i yapılandır
        uses: actions/configure-pages@v5
      - name: Siteyi paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
